<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Specula · CVE Priorities · __ORG__</title>
<meta name="author" content="Diljot Singh Johal">
<style>
:root{--bg:#060a11;--bg2:#0a101b;--fg:#e6edf6;--mute:#8d9bb0;--dim:#5d6c83;--card:#0e1624;--line:#1b2638;--line2:#28364d;--accent:#3ee6a8;--blue:#5aa9ff;
  --act:#ff4d5e;--attend:#ff9f43;--track:#4ea3ff;--ignore:#6b7a90;--amber:#ffc233;--mono:"Cascadia Code","JetBrains Mono",Consolas,monospace}
@media (prefers-color-scheme:light){:root{--bg:#f3f5f8;--bg2:#e9edf3;--fg:#0d1624;--mute:#56657b;--dim:#8391a6;--card:#fff;--line:#dfe5ee;--line2:#cbd4e1;--accent:#0f9d6c;--blue:#1f6fd1;
  --act:#d62839;--attend:#d9730d;--track:#1f6fd1}}
@media print{:root{--bg:#fff;--bg2:#f4f6f9;--fg:#000;--mute:#333;--card:#fff;--line:#ccc;--line2:#bbb}}
*{box-sizing:border-box}
body{margin:0;color:var(--fg);font:14px/1.5 "Segoe UI Variable Text","Segoe UI",Inter,system-ui,sans-serif;
  background:radial-gradient(1100px 500px at 90% -10%,rgba(90,169,255,.10),transparent 60%),radial-gradient(800px 400px at -10% 0%,rgba(62,230,168,.07),transparent 60%),var(--bg)}
header,main{max-width:1280px;margin:0 auto;padding:18px 20px}
main{padding-top:0}
.tlp{display:flex;justify-content:center;gap:10px;padding:6px 16px;background:#000;color:#8d9bb0;font:600 11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.tlp b{background:var(--amber);color:#000;padding:1px 8px;border-radius:3px}
.eyebrow{font:600 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
h1{font-size:26px;letter-spacing:-.02em;margin:6px 0 4px}.sub{color:var(--mute)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:18px 0}
.card{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;transition:.15s}
.card::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--c);box-shadow:0 0 12px var(--c)}
.card:hover{border-color:var(--line2)}
.card b{font:700 28px var(--mono);letter-spacing:-.03em;display:block}.card.off{opacity:.4}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
input,select{font:inherit;padding:9px 12px;border:1px solid var(--line2);border-radius:10px;background:var(--bg2);color:var(--fg)}
input{flex:1;min-width:200px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--bg2);cursor:pointer;white-space:nowrap;user-select:none;font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
th:hover{color:var(--accent)}
td.why{color:var(--mute);font-size:12.5px;min-width:320px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;color:#fff;font:700 11px var(--mono);letter-spacing:.04em;text-transform:uppercase}
a{color:var(--blue);white-space:nowrap;font-family:var(--mono);font-size:13px}
.foot{color:var(--dim);font-size:12.5px;margin-top:12px;display:flex;flex-wrap:wrap;gap:6px 18px}.foot span:first-child{flex:1}
.foot a{font-family:inherit;color:var(--mute)}
</style></head><body>
<div class="tlp"><b>TLP:AMBER</b> limited disclosure · organisation and clients, need-to-know only</div>
<header><div class="eyebrow">Specula · vulnerability intelligence · __DATE__</div><h1>CVE Priorities: __ORG__</h1>
<div class="sub">Click a tier card to show or hide it. Click a column heading to sort.</div>
<div class="cards" id="cards"></div>
<div class="controls"><input id="q" placeholder="Search CVE, asset, threat group, reason…" aria-label="Search">
<select id="src" aria-label="Source"><option value="">All sources</option><option>owned</option><option>third-party</option></select></div></header>
<main><div class="wrap"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div>
<div class="foot"><span id="foot"></span><span>Generated by Specula · by Diljot Singh Johal · MIT License</span></div></main>
<script>
const DATA = __DATA__;
const TIERS = ["Act", "Attend", "Track", "Ignore"];
const COLOR = {Act: "--act", Attend: "--attend", Track: "--track", Ignore: "--ignore"};
const COLS = [["tier","Tier"],["risk","Risk"],["cve","CVE"],["asset","Asset"],["source","Source"],["kev","KEV"],
              ["epss","EPSS"],["cvss","CVSS"],["groups","Threat groups"],["why","Why"]];
const NUMERIC = new Set(["risk", "epss", "cvss"]);
let show = new Set(["Act", "Attend"]), sortKey = "risk", asc = false;
const el = (tag, props = {}, kids = []) => { const e = document.createElement(tag); Object.assign(e, props); e.append(...kids); return e; };
const onActivate = (node, fn) => { node.onclick = fn; node.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fn(); } }; };

TIERS.forEach(t => {
  const card = el("div", {className: "card", tabIndex: 0}, [el("b", {textContent: DATA.filter(r => r.tier === t).length}), t]);
  card.style.setProperty("--c", `var(${COLOR[t]})`);
  card.dataset.tier = t;
  onActivate(card, () => { show.has(t) ? show.delete(t) : show.add(t); render(); });
  document.getElementById("cards").append(card);
});
COLS.forEach(([key, label]) => {
  const th = el("th", {textContent: label, tabIndex: 0});
  onActivate(th, () => { asc = sortKey === key ? !asc : !NUMERIC.has(key); sortKey = key; render(); });
  document.getElementById("head").append(th);
});
document.getElementById("q").oninput = render;
document.getElementById("src").onchange = render;

function render() {
  document.querySelectorAll(".card").forEach(c => c.classList.toggle("off", !show.has(c.dataset.tier)));
  const q = document.getElementById("q").value.toLowerCase(), src = document.getElementById("src").value;
  const rows = DATA.filter(r => show.has(r.tier) && (!src || r.source === src) &&
      (!q || [r.cve, r.asset, r.groups, r.why].join(" ").toLowerCase().includes(q)))
    .sort((a, b) => ((a[sortKey] ?? -1) > (b[sortKey] ?? -1) ? 1 : (a[sortKey] ?? -1) < (b[sortKey] ?? -1) ? -1 : 0) * (asc ? 1 : -1));
  const body = document.getElementById("body");
  body.replaceChildren();
  // textContent everywhere: feed data (CVE text, asset names) is never parsed as HTML
  rows.slice(0, 1000).forEach(r => {
    const pill = el("span", {className: "pill", textContent: r.tier});
    pill.style.background = `var(${COLOR[r.tier]})`;
    const link = el("a", {href: "https://nvd.nist.gov/vuln/detail/" + encodeURIComponent(r.cve), textContent: r.cve, target: "_blank", rel: "noopener"});
    body.append(el("tr", {}, [el("td", {}, [pill]), el("td", {textContent: r.risk}), el("td", {}, [link]),
      el("td", {textContent: r.asset}), el("td", {textContent: r.source}), el("td", {textContent: r.kev ? "yes" : ""}),
      el("td", {textContent: r.epss}), el("td", {textContent: r.cvss ?? "n/a"}), el("td", {textContent: r.groups}),
      el("td", {className: "why", textContent: r.why})]));
  });
  document.getElementById("foot").textContent =
    `${rows.length} findings shown` + (rows.length > 1000 ? " (first 1000 rendered; refine the search)" : "");
}
render();
</script></body></html>
