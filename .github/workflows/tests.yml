name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install --require-hashes -r requirements.txt
      - run: python test_pipeline.py
